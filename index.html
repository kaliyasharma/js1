<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Domain Merger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-area input {
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.domains {
            background: #e3f2fd;
            border: 2px solid #2196f3;
        }

        .stat-card.users {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .domains .stat-value {
            color: #2196f3;
        }

        .users .stat-value {
            color: #4caf50;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow: auto;
        }

        .preview pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            color: #333;
        }

        .file-list {
            margin: 20px 0;
        }

        .file-item {
            padding: 12px;
            background: #f0f0f0;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .error {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 JSON Domain Merger</h1>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <h3>📤 Upload JSON Files</h3>
            <p>Click here or drag and drop multiple JSON files</p>
            <input type="file" id="fileInput" accept=".json" multiple>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="fileList" class="file-list hidden">
            <h3>Uploaded Files:</h3>
            <div id="files"></div>
        </div>

        <div id="stats" class="stats hidden">
            <div class="stat-card domains">
                <div class="stat-label">Total Domains</div>
                <div class="stat-value" id="domainCount">0</div>
            </div>
            <div class="stat-card users">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="userCount">0</div>
            </div>
        </div>

        <button id="downloadBtn" class="hidden">⬇️ Download Merged JSON</button>

        <div id="preview" class="preview hidden">
            <h3>Preview:</h3>
            <pre id="previewContent"></pre>
        </div>
    </div>

    <script>
        let mergedData = null;

        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            const fileReaders = files.map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            let content = event.target.result;
                            // Fix missing commas between closing } and opening "
                            content = content.replace(/\}\s*\n\s*"/g, '},\n  "');
                            const json = JSON.parse(content);
                            resolve({ name: file.name, data: json });
                        } catch (err) {
                            reject(new Error(`Error parsing ${file.name}: ${err.message}`));
                        }
                    };
                    reader.onerror = () => reject(new Error(`Error reading ${file.name}`));
                    reader.readAsText(file);
                });
            });

            Promise.all(fileReaders)
                .then(parsedFiles => {
                    displayFiles(parsedFiles);
                    mergeJsonFiles(parsedFiles);
                    document.getElementById('error').classList.add('hidden');
                })
                .catch(err => {
                    showError(err.message);
                });
        }

        function displayFiles(files) {
            const fileList = document.getElementById('fileList');
            const filesDiv = document.getElementById('files');
            filesDiv.innerHTML = '';
            
            files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.textContent = file.name;
                filesDiv.appendChild(div);
            });
            
            fileList.classList.remove('hidden');
        }

        function mergeJsonFiles(fileList) {
            const merged = {};

            // Sort files: utpal files first, then admin files, then others
            const sortedFiles = [...fileList].sort((a, b) => {
                const aNameLower = a.name.toLowerCase();
                const bNameLower = b.name.toLowerCase();
                
                const aIsUtpal = aNameLower.startsWith('utpal');
                const bIsUtpal = bNameLower.startsWith('utpal');
                const aIsAdmin = aNameLower.startsWith('admin');
                const bIsAdmin = bNameLower.startsWith('admin');
                
                // Utpal files come first
                if (aIsUtpal && !bIsUtpal) return -1;
                if (!aIsUtpal && bIsUtpal) return 1;
                
                // Admin files come second
                if (aIsAdmin && !bIsAdmin) return -1;
                if (!aIsAdmin && bIsAdmin) return 1;
                
                return 0;
            });

            sortedFiles.forEach(file => {
                const jsonData = file.data;
                
                // Handle both formats: direct domain objects or nested with "domains"
                const domainsData = jsonData.domains || jsonData;
                
                Object.keys(domainsData).forEach(domain => {
                    // Remove https://, http://, www. prefixes
                    let cleanDomain = domain.replace(/^https?:\/\//i, '');
                    cleanDomain = cleanDomain.replace(/^www\./i, '');
                    
                    if (!merged[cleanDomain]) {
                        merged[cleanDomain] = { users: [] };
                    }
                    
                    if (domainsData[domain].users) {
                        // Add users without duplicates
                        domainsData[domain].users.forEach(user => {
                            if (!merged[cleanDomain].users.some(u => 
                                u[0] === user[0] && u[1] === user[1])) {
                                merged[cleanDomain].users.push(user);
                            }
                        });
                    }
                });
            });

            mergedData = merged;
            displayResults();
        }

        function displayResults() {
            // Update stats
            const domainCount = Object.keys(mergedData).length;
            const userCount = Object.values(mergedData)
                .reduce((sum, domain) => sum + domain.users.length, 0);

            document.getElementById('domainCount').textContent = domainCount;
            document.getElementById('userCount').textContent = userCount;
            document.getElementById('stats').classList.remove('hidden');

            // Wrap merged data in "domains" object
            const outputData = { domains: mergedData };

            // Show preview
            document.getElementById('previewContent').textContent = 
                JSON.stringify(outputData, null, 2);
            document.getElementById('preview').classList.remove('hidden');

            // Show download button
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!mergedData) return;
            
            // Wrap merged data in "domains" object for download
            const outputData = { domains: mergedData };
            
            const blob = new Blob([JSON.stringify(outputData, null, 2)], 
                { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'domains_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
